<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Time Clock</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--muted:#666;--soft:#f0f0f0;--warn:#c4001a;color-scheme:light}

/* Admin colour system (the kiosk never uses these). One colour per tab, per roster type and per status. Light theme only. */
:root{
/* tokens:light */
  --paper:#ffffff; --on-accent:#ffffff;
  --c-dashboard:#1d4ed8; --c-roster:#0f766e; --c-report:#166534; --c-shifts:#9a3412;
  --c-employees:#6d28d9; --c-audit:#475569; --c-settings:#be123c;
  --c-dashboard-soft:#dbeafe; --c-roster-soft:#ccfbf1; --c-report-soft:#dcfce7; --c-shifts-soft:#ffedd5;
  --c-employees-soft:#ede9fe; --c-audit-soft:#e2e8f0; --c-settings-soft:#ffe4e6;
  --t-cafe-bg:#eff8f3; --t-cafe-fg:#1a5c36; --t-bakery-bg:#fce7f3; --t-bakery-fg:#9d174d;
  --t-training-bg:#ede9fe; --t-training-fg:#5b21b6; --t-delivery-bg:#fff3e0; --t-delivery-fg:#b45309;
  --t-bake-bg:#fef9ee; --t-bake-fg:#92400e; --t-bkyc-bg:#fce7f3; --t-bkyc-fg:#9d174d; --t-off-bg:#e8e8e8; --t-off-fg:#666666;
  --t-cafe-bd:#a7d7bb; --t-bakery-bd:#f9badb; --t-training-bd:#c4b5fd; --t-delivery-bd:#fcd9a0;
  --t-bake-bd:#f5e0a0; --t-bkyc-bd:#f9badb; --t-off-bd:#cccccc;
  --s-on:#15803d; --s-break:#9a4508; --s-late:#c4001a; --s-ok:#15803d;
  --s-on-bg:#dcfce7; --s-break-bg:#ffedd5; --s-late-bg:#fde2e4; --s-ok-bg:#dcfce7;
/* end tokens:light */
}
#app.admin{--accent:var(--c-dashboard);--accent-soft:var(--c-dashboard-soft)}
#app.admin[data-tab="dashboard"]{--accent:var(--c-dashboard)}
#app.admin[data-tab="roster"]{--accent:var(--c-roster)}
#app.admin[data-tab="report"]{--accent:var(--c-report)}
#app.admin[data-tab="shifts"]{--accent:var(--c-shifts)}
#app.admin[data-tab="employees"]{--accent:var(--c-employees)}
#app.admin[data-tab="audit"]{--accent:var(--c-audit)}
#app.admin[data-tab="settings"]{--accent:var(--c-settings)}
#app.admin[data-tab="dashboard"]{--accent-soft:var(--c-dashboard-soft)}
#app.admin[data-tab="roster"]{--accent-soft:var(--c-roster-soft)}
#app.admin[data-tab="report"]{--accent-soft:var(--c-report-soft)}
#app.admin[data-tab="shifts"]{--accent-soft:var(--c-shifts-soft)}
#app.admin[data-tab="employees"]{--accent-soft:var(--c-employees-soft)}
#app.admin[data-tab="audit"]{--accent-soft:var(--c-audit-soft)}
#app.admin[data-tab="settings"]{--accent-soft:var(--c-settings-soft)}
#app.admin{min-height:100vh;background:linear-gradient(var(--accent-soft),#fff 320px)}
#app.admin .bar{background:var(--accent);color:var(--on-accent);border-bottom:0}
#app.admin .bar button{background:#fff;color:var(--accent);border-color:#fff;box-shadow:none}
#app.admin .bar button.inv{background:transparent;color:#fff}
#app.admin .brand::before{background:#fff}
/* Every tab shows its own colour before it is clicked; the open tab is solid. */
#app.admin .tabs{border-bottom:4px solid var(--accent);background:#fff;gap:6px;padding:8px 8px 0}
#app.admin .tabs button{background:var(--tab-soft);color:var(--tab);border:2px solid var(--tab);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:none}
#app.admin .tabs button.on{background:var(--tab);color:var(--on-accent)}
#app.admin button,#app.admin .btn{border-color:var(--accent);color:var(--accent);box-shadow:3px 3px 0 var(--accent);border-radius:8px}
#app.admin button.inv{background:var(--accent);color:var(--on-accent)}
#app.admin input,#app.admin select{border-color:var(--accent);border-width:2px;border-radius:6px}
#app.admin input:focus,#app.admin select:focus{outline-color:var(--accent)}
#app.admin label{color:var(--accent)}
#app.admin .tablewrap{border:2px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.08);border-radius:10px;background:#fff}
#app.admin th,#app.admin td{border-color:var(--accent-soft)}
#app.admin th{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#app.admin tbody tr:nth-child(even) td{background:#fafafa}
#app.admin tbody tr:hover td{background:var(--accent-soft)}
#app.admin tr.tot td{background:var(--accent-soft);border-top:3px solid var(--accent)}
#app.admin th .thbtn:focus-visible{outline-color:var(--on-accent)}
#app.admin th button.thbtn{all:unset;cursor:pointer;color:inherit}
#app.admin th small,#app.admin th .muted{color:inherit;opacity:.85}
#app.admin svg .c-ink{fill:var(--accent)}
#app.admin svg .s-ink{stroke:var(--accent)}
#app.admin .section{border:2px solid var(--accent);border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.06)}
#app.admin .section h3{color:var(--accent);border-left:8px solid var(--accent);padding-left:10px}
#app.admin h2.title{color:var(--accent)}
#app.admin .kpi{border:2px solid var(--accent);border-top:8px solid var(--accent);box-shadow:none;border-radius:10px;background:var(--accent-soft)}
#app.admin .kpi .v{color:var(--accent)}
#app.admin .kpis .kpi:nth-child(4n+2){--accent:var(--c-report);--accent-soft:var(--c-report-soft)}
#app.admin .kpis .kpi:nth-child(4n+3){--accent:var(--c-shifts);--accent-soft:var(--c-shifts-soft)}
#app.admin .kpis .kpi:nth-child(4n+4){--accent:var(--c-employees);--accent-soft:var(--c-employees-soft)}
#app.admin .kpi.alert{border-color:var(--s-late);background:var(--s-late-bg)}
#app.admin .kpi.alert .v{color:var(--s-late)}
#app.admin .alerts li{border-color:var(--accent-soft);border-left-color:var(--accent);background:#fff;border-radius:6px}
#app.admin .alerts li.lvl-high{border-left-color:var(--s-late);background:var(--s-late-bg)}
#app.admin .tag{border-radius:999px}
#app.admin .tag.b,#app.admin .tag.on{background:var(--s-on-bg);border-color:var(--s-on);color:var(--s-on)}
#app.admin .tag.brk{background:var(--s-break-bg);border-color:var(--s-break);color:var(--s-break)}
#app.admin .tag.late{background:var(--s-late-bg);border-color:var(--s-late);color:var(--s-late)}
#app.admin .tag.ok{background:var(--s-ok-bg);border-color:var(--s-ok);color:var(--s-ok)}
form[data-pay="hourly"] .pay-salary,form[data-pay="hourly"] span.pay-fixed,
form[data-pay="fixed"] .pay-salary,form[data-pay="fixed"] .pay-hourly:not(.pay-fixed),form[data-pay="fixed"] span.pay-hourly,
form[data-pay="salary"] .pay-hourly,form[data-pay="salary"] .pay-fixed{display:none}
.roster-wrap{overflow-x:auto}
.roster-grid{border-collapse:separate;border-spacing:0;min-width:760px}
.roster-grid th,.roster-grid td{border:0;border-right:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;text-align:center;vertical-align:top;padding:4px;white-space:normal}
.roster-grid .rname{position:-webkit-sticky;position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;font-weight:700;min-width:100px;max-width:130px}
.roster-grid th.rname{z-index:3;background:var(--accent,var(--ink));color:var(--on-accent,var(--paper))}
.roster-grid .rcell{cursor:pointer;min-width:92px;background:#fff}
.roster-grid .rcell:hover{background:var(--accent-soft,var(--soft))}
.roster-grid .rcell.draft{outline:3px dashed var(--accent,var(--ink));outline-offset:-3px;background:#fffbe6}
#app.admin button.save-roster{background:var(--s-late);border-color:var(--s-late);box-shadow:3px 3px 0 #7a0010}
.roster-grid .today{box-shadow:inset 0 0 0 3px var(--accent,var(--ink))}
.roster-grid tfoot td{font-weight:700;background:var(--accent-soft,var(--soft))}
.roster-grid tfoot .rname{background:var(--accent-soft,var(--soft))}
.chip{display:block;font-size:11px;font-weight:700;padding:4px 7px;margin:3px 0;border:1.5px solid;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.t-CAFE{background:var(--t-cafe-bg);color:var(--t-cafe-fg);border-color:var(--t-cafe-bd)}
.chip.t-BAKERY{background:var(--t-bakery-bg);color:var(--t-bakery-fg);border-color:var(--t-bakery-bd)}
.chip.t-TRAINING{background:var(--t-training-bg);color:var(--t-training-fg);border-color:var(--t-training-bd)}
.chip.t-DELIVERY{background:var(--t-delivery-bg);color:var(--t-delivery-fg);border-color:var(--t-delivery-bd)}
.chip.t-BAKE{background:var(--t-bake-bg);color:var(--t-bake-fg);border-color:var(--t-bake-bd)}
.chip.t-BKYC{background:var(--t-bkyc-bg);color:var(--t-bkyc-fg);border-color:var(--t-bkyc-bd)}
.chip.t-OFF{background:var(--t-off-bg);color:var(--t-off-fg);border-color:var(--t-off-bd)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Mono',ui-monospace,Consolas,monospace;font-size:15px}
button,.btn{font:inherit;cursor:pointer;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:0;display:inline-block;font-size:15px;margin:0}
button:active,.btn:active{transform:translate(4px,4px);box-shadow:none}
button.inv{background:var(--ink);color:var(--paper)}
button.sm,.btn.sm{padding:4px 10px;font-size:12px;box-shadow:2px 2px 0 var(--ink);border-width:2px}
button.sm:active,.btn.sm:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,.btn:focus-within{outline:3px dashed var(--ink);outline-offset:3px}
input,select{font:inherit;border:3px solid var(--ink);padding:8px 10px;background:var(--paper);color:var(--ink);border-radius:0;width:100%}
input:focus,select:focus{outline:3px dashed var(--ink);outline-offset:2px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
small,.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:4px solid var(--ink);flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:14px;height:14px;background:var(--ink);margin-right:10px;vertical-align:middle}

/* Kiosk */
.kiosk{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;max-width:1100px;margin:0 auto}
.card{border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px;background:var(--paper)}
.clockcard{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:420px}
.big{font-size:clamp(48px,9vw,96px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date{margin-top:12px;font-size:18px;text-transform:uppercase}
.onnow{margin-top:28px;border-top:3px solid var(--ink);padding-top:14px;width:100%;font-size:13px}
.lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.pins{display:flex;gap:12px;justify-content:center;margin:18px 0 22px}
.pins span{width:52px;height:60px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px}
.pins span.f{background:var(--ink);color:var(--paper)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{font-size:26px;padding:14px 0}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.name{font-size:30px;font-weight:700;text-align:center;margin:6px 0 10px;text-transform:uppercase}
.status{border:3px solid var(--ink);padding:12px;text-align:center;margin-bottom:16px;background:var(--soft)}
.status b{font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.mini div{border:3px solid var(--ink);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.mini .k{font-size:11px;text-transform:uppercase;font-weight:700}
.progress{height:14px;border:3px solid var(--ink);margin-bottom:4px}
.progress i{display:block;height:100%;background:var(--ink)}
.acts{display:grid;gap:14px;margin-top:18px}
.acts button{font-size:20px;padding:18px}
.acts button.sm{font-size:12px;padding:6px}

/* Admin */
.tabs{display:flex;gap:0;border-bottom:4px solid var(--ink);overflow-x:auto}
.tabs button{border:0;border-right:3px solid var(--ink);box-shadow:none;padding:14px 22px;white-space:nowrap}
.tabs button:active{transform:none}
.tabs button.on{background:var(--ink);color:var(--paper)}
.badge{display:inline-block;min-width:20px;padding:0 5px;background:var(--warn);color:#fff;font-size:11px;text-align:center}
.wrap{padding:22px;max-width:1400px;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.row.tight{margin:0}
.weeknav b{font-size:16px;padding:0 6px}
.tablewrap{overflow-x:auto;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);margin-bottom:22px}
.scrollx{overflow-x:auto}
.scrollx svg{min-width:720px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--ink);padding:8px;text-align:right;white-space:nowrap;vertical-align:top}
th{background:var(--ink);color:var(--paper);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
th .thbtn{all:unset;cursor:pointer}
th .thbtn:focus-visible{outline:2px dashed var(--paper);outline-offset:2px}
td.l,th.l{text-align:left}
td.wrap-text{white-space:normal;min-width:220px}
tr.tot td{font-weight:700;border-top:3px solid var(--ink);background:var(--soft)}
td.net{font-weight:700}
.tag{display:inline-block;border:2px solid var(--ink);padding:0 6px;font-size:11px;font-weight:700}
.tag.b{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.grid.one{grid-template-columns:1fr}
.grid.two{grid-template-columns:1fr 1fr}
.dyn{grid-template-columns:1fr 1fr auto;align-items:end}
.section{border:3px solid var(--ink);padding:18px;margin-bottom:22px}
.section h3{margin:0 0 14px;text-transform:uppercase;font-size:15px;letter-spacing:.06em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:0 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-top:6px}
.kpi.alert .v{color:var(--warn)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.alerts li{display:flex;justify-content:space-between;gap:12px;align-items:center;border:2px solid var(--ink);border-left-width:8px;padding:8px 10px;font-size:13px}
.alerts li.lvl-high{border-left-color:var(--warn)}
.alerts li.lvl-low{border-left-color:var(--muted)}
h2.title{margin:0 0 12px;text-transform:uppercase}

svg.chart{width:100%;height:auto;display:block}
svg .c-ink{fill:var(--ink)} svg .c-paper{fill:var(--paper)} svg .c-muted{fill:var(--muted)} svg .c-warn{fill:var(--warn)}
svg .s-ink{stroke:var(--ink)} svg .s-grid{stroke:var(--muted);stroke-opacity:.35} svg .s-warn{stroke:var(--warn)}
svg text{font-family:'Space Mono',ui-monospace,monospace;font-size:12px}
svg .tl-shift{cursor:pointer}
svg .tl-shift:hover rect{opacity:.8}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal .box{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:24px;width:100%;max-width:560px}
.modal h2{margin:0 0 16px;text-transform:uppercase;font-size:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 20px;font-weight:700;border:3px solid var(--paper);outline:3px solid var(--ink);z-index:30;max-width:calc(100% - 32px);text-align:center;display:flex;gap:14px;align-items:center}
.toast button{border-color:var(--paper);box-shadow:none}

html{-webkit-text-size-adjust:100%}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .row.tight{flex-wrap:nowrap}
.sm-only{display:none}
.tabs{scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

@media (max-width:820px){
  .kiosk{grid-template-columns:1fr;padding:16px;gap:20px}
  .clockcard{min-height:auto}
  .wrap{padding:16px}
  .bar{padding:12px 16px}
  .grid.two{grid-template-columns:1fr}
}

/* Phones */
@media (max-width:700px){
  html,body{font-size:14px}
  input,select{font-size:16px}
  .hide-sm{display:none!important}
  .sm-only{display:inline}
  button.sm,.btn.sm{padding:8px 12px}

  .bar{padding:10px 12px;flex-wrap:nowrap}
  .brand{font-size:16px}
  .brand::before{width:11px;height:11px;margin-right:8px}
  .bar button.sm{padding:8px 10px}
  .tabs{position:sticky;top:0;z-index:5;background:var(--paper)}
  .tabs button{padding:12px 14px;font-size:13px}
  .wrap{padding:12px}

  .kiosk{padding:12px;gap:14px}
  .card{padding:18px;box-shadow:5px 5px 0 var(--ink);border-width:3px}
  .clockcard{padding:16px}
  .big{font-size:52px}
  .date{font-size:13px;margin-top:6px}
  .onnow{margin-top:12px;padding-top:10px;font-size:12px}
  .pins{margin:14px 0 18px;gap:10px}
  .pins span{width:46px;height:52px}
  .keys{gap:10px}
  .keys button{font-size:24px;padding:12px 0}
  .name{font-size:24px}
  .acts{gap:12px;margin-top:14px}
  .acts button{font-size:18px;padding:15px}

  .weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:8px}
  .weeknav b{text-align:center;font-size:12px;padding:0}
  .weeknav input{grid-column:span 2}
  h2.title{font-size:17px}
  .section{padding:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:10px;box-shadow:3px 3px 0 var(--ink)}
  .kpi .v{font-size:20px}
  .cols{gap:0}
  .alerts li{flex-wrap:wrap}
  .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions-grid button{width:100%;padding:12px 8px;font-size:13px}

  /* Data tables become one card per row, each value labelled */
  .tablewrap{box-shadow:4px 4px 0 var(--ink)}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr{display:block;width:100%}
  table.stack tr{border-bottom:3px solid var(--ink)}
  table.stack tr:last-child{border-bottom:0}
  table.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;border-bottom:1px solid var(--soft);padding:7px 12px;white-space:normal;text-align:right}
  table.stack td::before{content:attr(data-label);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;color:var(--muted);flex:none}
  table.stack td.head{font-size:16px;font-weight:700;background:var(--soft);justify-content:flex-start;text-align:left}
  table.stack td.head::before{content:none}
  table.stack td[data-label=""]{justify-content:flex-end;gap:10px}
  table.stack td[data-label=""]::before{content:none}
  table.stack td.d,table.stack td.hide-sm{display:none}
  table.stack td.net{font-size:16px}
  table.stack td.wrap-text{min-width:0}
  table.stack tr.tot td{border-top:0;background:var(--soft)}

  .modal{padding:12px 8px}
  .modal .box{padding:18px;box-shadow:6px 6px 0 var(--ink);border-width:3px}
  .dyn{grid-template-columns:1fr}
  .dyn.rule{grid-template-columns:1fr 1fr}
  .dyn > button{grid-column:1/-1;justify-self:start}
  .toast{bottom:12px;width:calc(100% - 24px);max-width:none;flex-wrap:wrap;justify-content:center;padding:12px 14px;font-size:13px}
}
@media print{
  .noprint{display:none!important}
  .tablewrap{box-shadow:none;overflow:visible}
  body{font-size:11px}
  th,td{padding:4px}
}
</style>
</head>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="box" id="modalBox"></div></div>
